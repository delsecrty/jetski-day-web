 flex-end; background: #0B1E1A; overflow: hidden;\">\n  <div style=\"position: absolute; inset: 0;\">\n    <image-slot id=\"tourist-hero-bg-en\" shape=\"rect\" placeholder=\"Photo: travelers enjoying the Delta experience\" src=\"1c818533-5298-4ffb-b923-8439e1d43203\"><\u002Fimage-slot>\n  <\u002Fdiv>\n  <div style=\"position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,30,26,0.35) 0%, rgba(11,30,26,0.12) 40%, rgba(11,30,26,0.82) 100%);\"><\u002Fdiv>\n  <div style=\"position: relative; width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 48px) clamp(48px, 8vh, 90px);\">\n    <p style=\"margin: 0 0 14px; color: #8FD0C0; font-size: 13px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;\">Tourism · Buenos Aires<\u002Fp>\n    <h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(38px, 7vw, 80px); line-height: 1.03; color: #F2EDE2; max-width: 16ch; text-wrap: pretty;\">A different experience for travelers in Buenos Aires<\u002Fh1>\n    <p style=\"margin: 20px 0 0; color: rgba(242,237,226,0.9); font-size: clamp(16px, 2.2vw, 20px); line-height: 1.55; max-width: 60ch; text-wrap: pretty;\">Just minutes from the city, the Paraná Delta is waiting. Discover a unique experience near Buenos Aires: ride the Delta on a jet ski with a professional rider who knows the river and builds the outing around you.<\u002Fp>\n    <div style=\"margin-top: 30px;\">\n      <a href=\"https://wa.me/5491127334172?text=Hi!%20I%20would%20like%20to%20book%20a%20Jet%20Ski%20Day%20ride%20%F0%9F%8C%8A\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; gap: 10px; background: #FDDF01; color: #14312A; text-decoration: none; font-weight: 600; font-size: 16px; padding: 15px 26px; border-radius: 999px; box-shadow: 0 8px 24px rgba(253,223,1,0.35);\" style-hover=\"background: #E5C900; color: #14312A;\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"
